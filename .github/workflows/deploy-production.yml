name: CD

on:
  push:
    branches: [ master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'yarn'

      # Step 3: Install dependencies with Yarn
      - name: Install dependencies
        run: yarn install

      # Step 4: Build the Vite app
      - name: Build the Vite app
        run: yarn build

      # Step 5: Debug workspace after build
      - name: Debug workspace after build
        run: |
          echo "Listing contents of workspace after build:"
          ls -alh ./dist

      # Step 6: Verify dist directory is generated
      - name: Verify dist directory
        run: |
          if [ ! -d "./dist" ]; then
            echo "Error: dist directory not found!"
            exit 1
          fi
          echo "Dist directory exists!"

      # Step 7: Deploy to the server
      - name: Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ vars.SERVER_HOST }}
          port: 22
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /srv/swagger
            git pull
            echo "Listing contents of the dist directory in GitHub workspace:"
            ls -alh ${{ github.workspace }}/dist
            if [ ! -d "${{ github.workspace }}/dist" ]; then
              echo "Error: dist directory not found in GitHub workspace!"
              exit 1
            fi
            rm -rf ./dist
            cp -r ${{ github.workspace }}/dist ./dist
