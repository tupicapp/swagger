name: CD

on:
  push:
    branches: [ master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'yarn'

      # Step 3: Install dependencies with Yarn
      - name: Install dependencies
        run: yarn install

      # Step 4: Build the Vite app
      - name: Build the Vite app
        run: yarn build

      # Step 5: Debug build process
      - name: Debug build process
        run: |
          echo "Checking workspace contents..."
          ls -R ${{ github.workspace }}

      # Step 6: Deploy to the server
      - name: Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ vars.SERVER_HOST }}
          port: 22
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /srv/swagger
            git pull
            if [ ! -d ${{ github.workspace }}/dist ]; then
              echo "Error: dist directory not found in GitHub workspace!"
              exit 1
            fi
            rm -rf ./dist
            cp -r ${{ github.workspace }}/dist ./dist
