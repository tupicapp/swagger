name: CD

on:
  push:
    branches: [ master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout repository
      - name: Checkout code
        uses: actions/checkout@v2

      # Step 2: Set up Node.js and install dependencies
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '20'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: yarn install

      # Step 4: Build the project
      - name: Build the project
        run: |
          yarn build
          echo "Listing contents of the workspace after build:"
          ls -alh ./dist

      # Step 5: Deploy to the server via SSH
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ vars.SERVER_HOST }}
          port: 22
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /srv/swagger
            git pull
            echo "Listing contents of the dist directory in GitHub workspace:"
            ls -alh ./dist || echo "dist directory not found"
            if [ ! -d "./dist" ]; then
              echo "Error: dist directory not found!"
              exit 1
            fi
            rm -rf ./dist
            echo "Copying dist directory to the server..."
            cp -r ./dist /srv/swagger/dist
            echo "Deployment complete."