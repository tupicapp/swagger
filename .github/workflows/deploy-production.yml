name: CD

on:
  push:
    branches: [ master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build the Vite app
        run: npm run build

      - name: Verify build output
        run: ls -la ${{ github.workspace }}/dist

      - name: Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ vars.SERVER_HOST }}
          port: 22
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /srv/swagger
            git pull
            # Ensure dist exists in the runner
            if [ ! -d ${{ github.workspace }}/dist ]; then
              echo "Error: dist directory not found in GitHub workspace!"
              exit 1
            fi
            # Deploy the new build
            rm -rf ./dist
            cp -r ${{ github.workspace }}/dist ./dist
      
