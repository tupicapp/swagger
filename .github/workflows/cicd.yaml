name: Build & Deploy App

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  packages: read

concurrency:
  group: build-deploy-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ github.ref_name == 'main' && 'production' || 'development' }}
    uses: tupicapp/platform-workflows/.github/workflows/shared-eks-build.yaml@main
    permissions:
      contents: read
      id-token: write
      packages: read
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
    with:
      dockerfile: Dockerfile
      environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
      runner_type: ${{ vars.RUNNER_TYPE || 'ubuntu-latest' }}

  update-manifest:
    name: Update Helm Manifest
    needs: build
    uses: tupicapp/platform-workflows/.github/workflows/update-manifest.yaml@main
    with:
      # The chart directory in platform-manifests. Spelled out rather than left
      # to default from the repository name: six of these repositories are named
      # something else on GitHub than the ArgoCD Application that deploys them,
      # and a rename should not quietly stop deployments.
      app: swagger
      image_tag: ${{ needs.build.outputs.image_tag }}
    secrets: inherit
