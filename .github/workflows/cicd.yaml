name: Build App

on:
  push:
    branches:
      - dev
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ github.ref_name == 'main' && 'Production' || 'Development' }}
    uses: tupicapp/platform-infra/.github/workflows/shared-eks-build.yaml@main

    # Dynamically choose correct AWS keys
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets[ github.ref_name == 'main' && 'PRODUCTION_AWS_ACCESS_KEY_ID' || 'DEVELOPMENT_AWS_ACCESS_KEY_ID' ] }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets[ github.ref_name == 'main' && 'PRODUCTION_AWS_SECRET_ACCESS_KEY' || 'DEVELOPMENT_AWS_SECRET_ACCESS_KEY' ] }}

    with:
      dockerfile: Dockerfile
      registry_path: ${{ vars[ github.ref_name == 'main' && 'PRODUCTION_REGISTRY_PATH' || 'DEVELOPMENT_REGISTRY_PATH' ] }}
      region: ${{ vars[ github.ref_name == 'main' && 'PRODUCTION_REGION' || 'DEVELOPMENT_REGION' ] }}
      runner_type: ${{ vars.RUNNER_TYPE || 'ubuntu-latest' }}

  update-manifest:
    name: Update Helm Manifest
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Select correct Helm file
        id: helmfile
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "file=helm-charts/app/values.yaml" >> $GITHUB_OUTPUT
          else
            echo "file=helm-charts/app/values.development.yaml" >> $GITHUB_OUTPUT
          fi

      - name: Update image tag
        run: |
          FILE="${{ steps.helmfile.outputs.file }}"
          TAG="${{ needs.build.outputs.image_tag }}"

          echo "Updating $FILE with new tag: $TAG"
          sed -i "s|tag:.*|tag: \"$TAG\"|g" "$FILE"

      - name: Commit and push changes
        run: |
          # Original commit author+message
          COMMIT_MSG=$(git log -1 --pretty=%B)
          AUTHOR_NAME=$(git log -1 --pretty="%an")
          AUTHOR_EMAIL=$(git log -1 --pretty="%ae")

          git config user.name "$AUTHOR_NAME"
          git config user.email "$AUTHOR_EMAIL"

          git add helm-charts/app/

          if git diff --cached --quiet; then
            echo "No changes in Helm values — skipping commit."
          else
            echo "Committing Helm update..."
            git commit -m "$COMMIT_MSG"
            git push
          fi
