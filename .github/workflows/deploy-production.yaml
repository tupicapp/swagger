name: Deploy Production

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    name: Build Production
    uses: gibical/infra/.github/workflows/shared-eks-build.yaml@main
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.PRODUCTION_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.PRODUCTION_AWS_SECRET_ACCESS_KEY }}
    with:
      registry_path: ${{ vars.PRODUCTION_REGISTRY_PATH }}
      region: ${{ vars.PRODUCTION_REGION }}
      dockerfile: Dockerfile
      docker_args: |
        --build-arg CORE_URL=${{ vars.PRODUCTION_CORE_URL }} \
        --build-arg OAUTH_URL=${{ vars.PRODUCTION_OAUTH_URL }} \
        --build-arg BLOG_URL=${{ vars.PRODUCTION_BLOG_URL }} \

  update-manifest:
    name: Update Image Tag
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Update values.yaml
        run: |
          sed -i "s|tag:.*|tag: \"${{ needs.build.outputs.image_tag }}\"|g" helm-charts/app/values.yaml
          
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm-charts/app/values.yaml
          git commit -m "chore: update image tag to ${{ needs.build.outputs.image_tag }}" || echo "No changes to commit"
          git push