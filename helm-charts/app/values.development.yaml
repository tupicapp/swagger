replicaCount: 1

image:
  app:
    repository: "992382452361.dkr.ecr.eu-central-1.amazonaws.com/swagger/app"
    tag: "latest"
    pullPolicy: "IfNotPresent"

imagePullSecret:

ingress:
  controller: "alb"
  certificationArn: "arn:aws:acm:eu-central-1:992382452361:certificate/63b3df72-af45-4232-8c80-00379b018351"
  host:

hpa:
  minReplicas: 1
  maxReplicas: 3
  cpu:
    target: 95
  memory:
    target: 95

resources:
  requests:
    cpu: "20m"
    memory: "20Mi"
    ephemeral-storage: "25Mi"
  limits:
    cpu: "25m"
    memory: "25Mi"
    ephemeral-storage: "30Mi"

env:
  variables:
    VITE_CORE_URL: "https://api.gibical.app/docs/api.json"
    VITE_OAUTH_URL: "https://api.gibical.app/swagger/oauth.json"
    VITE_BLOG_URL: "/configs/blog-v1-development.json"

